# Security Audit Configuration
# https://docs.rs/cargo-audit/latest/cargo_audit/
#
# Every ignore below names the exact dependency path that brings the advisory
# in, why no fix can be taken from this repository, and the condition for
# dropping the entry. deny.toml carries the same list (cargo-deny does not read
# this file). Re-verify the paths with:
#   cargo tree --workspace --all-features -i <crate>@<version> -e normal,build,dev

[advisories]
ignore = [
    #
    # === VULNERABILITIES ===
    #

    # RUSTSEC-2023-0071: rsa 0.9 - Marvin Attack timing side channel. No fixed
    # release of `rsa` exists.
    # Path: rsa <- superboring <- jwt-simple <- web-push 0.11.0 (newest) <-
    # armature-push (`web-push` feature). web-push signs VAPID with ES256; its
    # RSA code is compiled in but not used for anything here. First-party JWT
    # code (armature-jwt, armature-push's own signing) uses jsonwebtoken's
    # aws-lc backend and does not link `rsa`.
    # Drop when web-push stops depending on jwt-simple/superboring.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0049 / -0098 / -0099 / -0104: rustls-webpki 0.102.8 - CRL
    # and name-constraint verification issues.
    # Path: rustls-webpki 0.102.8 <- rumqttc 0.25.1 (newest) <- mq-bridge
    # (`mqtt` feature) <- armature-messaging `mq-bridge-mqtt` / `mq-bridge-full`
    # (opt-in). Every other TLS stack in the tree resolves rustls-webpki
    # 0.103.15, which is patched.
    # Drop when rumqttc releases against rustls-webpki >= 0.103.13.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",

    # RUSTSEC-2026-0194 / -0195: quick-xml 0.26 - quadratic attribute check /
    # unbounded namespace allocation (DoS on hostile XML).
    # Path: quick-xml 0.26.0 <- inferno 0.11 <- pprof 0.15.0 (newest, `flamegraph`
    # feature) <- armature-framework [dev-dependencies], used only by
    # examples/profiling_server.rs to render flame graphs of our own process.
    # It never parses untrusted XML and is not in any published dependency
    # graph. (samael, the SAML path, is on patched quick-xml 0.41.)
    # Drop when pprof moves to inferno >= 0.12.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    #
    # === UNMAINTAINED ===
    #

    # RUSTSEC-2025-0134: rustls-pemfile. First-party crates moved to
    # rustls-pki-types' PemObject; it remains only via mq-bridge's `mqtt`
    # feature (armature-messaging, opt-in). Drop with the rumqttc entry above.
    "RUSTSEC-2025-0134",

    # RUSTSEC-2024-0449: unsafe-libyaml. First-party YAML uses serde_norway; it
    # remains only via serde_yaml_ng <- mq-bridge (armature-messaging, opt-in).
    # Drop when mq-bridge replaces serde_yaml_ng.
    "RUSTSEC-2024-0449",

    # RUSTSEC-2026-0249: smartstring. Every rhai release depends on it
    # (armature-rhai / armature-app). Drop when rhai replaces it.
    "RUSTSEC-2026-0249",

    # RUSTSEC-2026-0192: ttf-parser. ab_glyph 0.2.32 (newest) via
    # armature-files' `images` feature (text watermarks). Drop when ab_glyph
    # moves to a maintained parser such as skrifa.
    "RUSTSEC-2026-0192",

    # RUSTSEC-2025-0057 / RUSTSEC-2024-0384: fxhash / instant. sled 0.34.7
    # (newest) <- mq-bridge `dedup` <- armature-messaging `mq-bridge-full`
    # (opt-in). Drop when mq-bridge moves off sled 0.34.
    "RUSTSEC-2025-0057",
    "RUSTSEC-2024-0384",
]
