# GitHub Actions PR Automation
#
# Auto-labels PRs based on files changed and runs quick checks

name: PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  # ============================================================================
  # AUTO-LABEL
  # ============================================================================

  label:
    name: Auto Label
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label PR
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

  # ============================================================================
  # SIZE CHECK
  # ============================================================================

  size:
    permissions:
      contents: read
      pull-requests: read
    name: PR Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Check PR size
        id: size
        run: |
          ADDITIONS=$(gh pr view ${{ github.event.pull_request.number }} --json additions -q '.additions')
          DELETIONS=$(gh pr view ${{ github.event.pull_request.number }} --json deletions -q '.deletions')
          TOTAL=$((ADDITIONS + DELETIONS))
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          if [ $TOTAL -gt 1000 ]; then
            echo "⚠️ Large PR: $TOTAL lines changed"
            echo "Consider breaking this into smaller PRs"
          elif [ $TOTAL -gt 500 ]; then
            echo "📦 Medium PR: $TOTAL lines changed"
          else
            echo "✅ Small PR: $TOTAL lines changed"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # COMMIT MESSAGE CHECK
  # ============================================================================

  commits:
    name: Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Check commit messages
        run: |
          echo "Checking commit message format..."

          # Get all commits in PR
          COMMITS=$(git log --format='%s' origin/${{ github.base_ref }}..HEAD)

          # Check for conventional commits
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+'

          while IFS= read -r commit; do
            if [[ ! "$commit" =~ $PATTERN ]]; then
              echo "❌ Invalid commit message: $commit"
              echo "Expected format: type(scope): description"
              echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            else
              echo "✅ $commit"
            fi
          done <<< "$COMMITS"

  # ============================================================================
  # DOCUMENTATION CHECK
  # ============================================================================

  docs:
    permissions:
      contents: read
      pull-requests: read
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check for documentation
        run: |
          # Get list of changed files
          CHANGED=$(gh pr view ${{ github.event.pull_request.number }} --json files -q '.files[].path')

          # Check if Rust files changed but no docs
          HAS_RS=$(echo "$CHANGED" | grep -E '\.rs$' || true)
          HAS_DOCS=$(echo "$CHANGED" | grep -E '(docs/|\.md$)' || true)

          if [ -n "$HAS_RS" ] && [ -z "$HAS_DOCS" ]; then
            echo "⚠️ Rust files changed but no documentation updates found"
            echo "Consider updating documentation if this adds new features"
          else
            echo "✅ Documentation check passed"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

