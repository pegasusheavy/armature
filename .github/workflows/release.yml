# GitHub Actions Release Pipeline for Armature Framework

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # CREATE GITHUB RELEASE
  #
  # No binary artifacts are attached: armature-framework's root package is a
  # library (no [[bin]] target), and the prior per-platform build+upload
  # machinery existed solely to attach files here -- it uploaded the entire
  # `target/<target>/release/` directory (every intermediate .o/.rlib/header
  # from every dependency, thousands of files) as individual release assets,
  # which was both meaningless (nothing there was a real deliverable) and
  # unreliable (frequent transient network failures from the sheer number of
  # uploads).
  #
  # Publishing to crates.io is deliberately NOT done here: it runs manually from
  # a maintainer machine via scripts/publish.sh. Keeping the registry token out
  # of CI means no third-party action, cached `target/`, or dependency build
  # script executed in CI can ever see it.
  # ============================================================================

  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag filter above admits only `vMAJOR.MINOR.PATCH`, so the derived
      # values are digits and dots; they still go through env, never inline.
      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          REQ="${VERSION%.*}"
          cat > release-notes.md <<NOTES
          # Armature ${TAG}

          See the [CHANGELOG](https://github.com/quinnjr/armature/blob/main/CHANGELOG.md) and each crate's own CHANGELOG.md for details.

          ## Installation

          The crate is published as \`armature-framework\`; its library name is \`armature\`.
          (The crates.io crate named \`armature\` is an unrelated project.)

          \`\`\`toml
          [dependencies]
          armature = { package = "armature-framework", version = "${REQ}" }
          \`\`\`
          NOTES

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Release ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
