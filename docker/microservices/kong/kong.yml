# Kong Declarative Configuration for Armature Microservices
_format_version: "3.0"

# Services
services:
  # User Service
  - name: user-service
    url: http://user-service:3000
    routes:
      - name: users-api
        paths:
          - /api/v1/users
          - /api/v1/auth
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        plugins:
          - name: rate-limiting
            config:
              minute: 100
              policy: local
          - name: cors
            config:
              # Explicit origins: a wildcard combined with credentials would
              # let any website make authenticated calls with a visitor's
              # cookies. List your real frontend origins here.
              origins:
                - "http://localhost:3000"
                - "http://localhost:5173"
              methods:
                - GET
                - POST
                - PUT
                - PATCH
                - DELETE
              headers:
                - Accept
                - Authorization
                - Content-Type
              credentials: true
              max_age: 3600

  # Product Service
  - name: product-service
    url: http://product-service:3000
    routes:
      - name: products-api
        paths:
          - /api/v1/products
          - /api/v1/categories
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        plugins:
          - name: rate-limiting
            config:
              minute: 200
              policy: local
          - name: request-size-limiting
            config:
              allowed_payload_size: 10

  # Order Service
  - name: order-service
    url: http://order-service:3000
    routes:
      - name: orders-api
        paths:
          - /api/v1/orders
          - /api/v1/cart
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        plugins:
          - name: rate-limiting
            config:
              minute: 50
              policy: local
          - name: jwt
            config:
              claims_to_verify:
                - exp

  # Health Check Route
  - name: health-service
    url: http://user-service:3000
    routes:
      - name: health
        paths:
          - /health
        strip_path: false
        methods:
          - GET

# Global Plugins
plugins:
  # Request/Response logging
  - name: file-log
    config:
      path: /dev/stdout
      reopen: true

  # Add correlation ID
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

# Consumers (API clients) and their key-auth credentials are intentionally
# not declared here: keys in a committed file are public. This stack runs
# Kong DB-less, so add them by rendering this file from your secret store at
# deploy time (for example decK with `${{ env "DECK_..." }}` substitution)
# rather than by committing real keys.
