# Prometheus Configuration for Armature
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: armature-local
    env: development

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Armature API metrics
  - job_name: "armature-api"
    static_configs:
      - targets: ["api:3000"]
    metrics_path: /metrics
    scrape_interval: 5s

  # Node Exporter (host metrics)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # cAdvisor (container metrics)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Containers are scraped through the static targets above. Docker-label
  # service discovery (docker_sd_configs) is not used: it needs the Docker
  # socket, which is root-equivalent access to the host.
