# =============================================================================
# Armature API Minimal - Docker Compose Configuration
# =============================================================================
# DEVELOPMENT ONLY. Do not expose this stack to an untrusted network or reuse
# its configuration in production. Published ports are bound to 127.0.0.1
# (Docker's own iptables rules bypass host firewalls for published ports).
# Secrets come from .env (copy .env.example); Compose refuses to start while a
# required one is unset. Images are pinned by tag and digest.
#
# Usage:
#   docker compose up
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - RUST_LOG=${RUST_LOG:-info}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Development Services (optional)
  # ---------------------------------------------------------------------------
