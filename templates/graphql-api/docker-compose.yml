# =============================================================================
# Armature GraphQL API - Docker Compose Configuration
# =============================================================================
# DEVELOPMENT ONLY. Do not expose this stack to an untrusted network or reuse
# its configuration in production. Published ports are bound to 127.0.0.1
# (Docker's own iptables rules bypass host firewalls for published ports).
# Secrets come from .env (copy .env.example); Compose refuses to start while a
# required one is unset. Images are pinned by tag and digest.
#
# Usage:
#   cp .env.example .env   # then set POSTGRES_PASSWORD and REDIS_PASSWORD
#   docker compose up
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # GraphQL API Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - RUST_LOG=${RUST_LOG:-info,async_graphql=debug}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # The playground is opt-in (off unless GRAPHQL_PLAYGROUND=true).
      - GRAPHQL_PLAYGROUND=${GRAPHQL_PLAYGROUND:-false}
      # Introspection and GET /graphql/schema are opt-in as well.
      - GRAPHQL_INTROSPECTION=${GRAPHQL_INTROSPECTION:-false}
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}@db:5432/graphql
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (openssl rand -hex 32)}@redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      POSTGRES_DB: graphql
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis (for caching/subscriptions)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # The password is read from the environment inside the container rather
    # than interpolated into the command line by Compose.
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (openssl rand -hex 32)}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (openssl rand -hex 32)}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
  redis_data:

