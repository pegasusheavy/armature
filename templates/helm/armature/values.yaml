# =============================================================================
# Armature Helm Chart - Default Values
# =============================================================================

# Application name
name: armature-api

# NOTE: The Deployment-related defaults below (replicaCount, podAnnotations,
# podSecurityContext, securityContext, resources, the probes, and
# terminationGracePeriodSeconds) are intentionally kept in sync with the
# equivalent hardcoded values in templates/k8s/deployment.yaml. If you change
# one, check the other.

# Number of replicas
replicaCount: 3

# Container image configuration
#
# REQUIRED: there is no default image. The Armature project does not publish
# an application image; point this at YOUR registry. Rendering fails until
# image.repository and one of image.digest / image.tag are set.
# Prefer a digest (immutable) over a tag:
#   --set image.repository=registry.example.com/my-api \
#   --set image.digest=sha256:<64 hex chars>
image:
  repository: ""
  # Immutable content digest, e.g. "sha256:abc..."; takes precedence over tag.
  digest: ""
  # Used only when digest is empty. "latest" is rejected.
  tag: ""
  pullPolicy: IfNotPresent

# Image pull secrets for private registries
imagePullSecrets: []

# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Extra pod annotations (Prometheus scrape annotations are added
# automatically from `metrics` below)
podAnnotations: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Service configuration (application traffic only; the metrics port is
# never exposed through the Service or Ingress)
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Prometheus metrics, served by the app on a dedicated port. Only pods in
# namespaces matching networkPolicy.monitoringNamespaceSelector may reach it.
metrics:
  enabled: true
  port: 9090
  path: /metrics

# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: armature-api-tls
      hosts:
        - api.example.com

# Resource limits and requests
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Horizontal Pod Autoscaler
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
pdb:
  enabled: true
  minAvailable: 1

# Network Policy (on by default: default-deny with explicit allows)
networkPolicy:
  enabled: true
  # Namespaces allowed to reach the HTTP port (your ingress controller)
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  # Namespaces allowed to scrape the metrics port
  monitoringNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring
  # Allow pods in the release namespace to call the HTTP port
  allowSameNamespace: true
  # Additional egress rules (databases, caches, ...), as NetworkPolicy
  # egress entries. DNS and HTTPS to public addresses are always allowed.
  extraEgress: []
  #  - to:
  #      - namespaceSelector:
  #          matchLabels:
  #            kubernetes.io/metadata.name: databases
  #    ports:
  #      - protocol: TCP
  #        port: 5432

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: armature-api
          topologyKey: kubernetes.io/hostname

# Environment variables
env:
  HOST: "0.0.0.0"
  PORT: "3000"
  RUST_LOG: "info"
  ENVIRONMENT: "production"

# Environment variables from secrets
envFrom: []
#  - secretRef:
#      name: armature-secrets

# Secrets
#
# Either reference a Secret you manage yourself (External Secrets, Sealed
# Secrets, Vault, `kubectl create secret`), which must contain the key
# `jwt-secret` and may contain `database-url` / `redis-url`:
#   --set secrets.existingSecret=my-api-secrets
# or let the chart create one from values (keep these out of committed files):
#   --set secrets.jwtSecret="$(openssl rand -hex 32)"
#
# JWT_SECRET is REQUIRED: rendering fails if neither existingSecret nor a
# jwtSecret of at least 32 characters is given. There is no default secret.
secrets:
  existingSecret: ""
  jwtSecret: ""
  databaseUrl: ""
  redisUrl: ""
  # Bump after rotating the secret to roll the pods (the secret's content is
  # deliberately not hashed into a pod annotation).
  revision: "1"

# ConfigMap data
config:
  enabled: true
  data:
    config.toml: |
      [server]
      host = "0.0.0.0"
      port = 3000

      [logging]
      level = "info"
      format = "json"

      [metrics]
      enabled = true
      # Dedicated listener: keeps /metrics off the public HTTP port
      port = 9090
      endpoint = "/metrics"

# Liveness probe
livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Readiness probe
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Startup probe
startupProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

# Termination grace period
terminationGracePeriodSeconds: 30

# Extra volumes
extraVolumes: []

# Extra volume mounts
extraVolumeMounts: []

# Init containers
initContainers: []

# Sidecar containers
sidecars: []

