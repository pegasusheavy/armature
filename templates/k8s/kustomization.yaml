# =============================================================================
# Armature - Kustomize Base
# =============================================================================
# Copy this directory into your own repository and use it as a LOCAL base
# for overlays (do not reference a remote base you do not control):
#   resources:
#     - ../../base
#
# Before applying, an overlay must:
#   1. set the image (the base uses the deliberately invalid placeholder
#      REPLACE_WITH_YOUR_IMAGE, so pods fail with InvalidImageName until you
#      do) -- see the `images:` example below; and
#   2. provide the `armature-api-secrets` Secret (see secret.yaml.example);
#      the base ships no Secret, so pods fail closed until it exists.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: armature

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  # Uncomment as needed:
  # - ingress.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: armature

# Override these in your overlay. Pin by digest (immutable):
# images:
#   - name: REPLACE_WITH_YOUR_IMAGE
#     newName: registry.example.com/my-api
#     digest: sha256:<digest printed by docker push>

# configMapGenerator:
#   - name: armature-api-config
#     behavior: merge
#     literals:
#       - ENVIRONMENT=production

