# =============================================================================
# Armature Microservice - Docker Compose Configuration
# =============================================================================
# DEVELOPMENT ONLY. Do not expose this stack to an untrusted network or reuse
# its configuration in production. Published ports are bound to 127.0.0.1
# (Docker's own iptables rules bypass host firewalls for published ports).
# Secrets come from .env (copy .env.example); Compose refuses to start while a
# required one is unset. Images are pinned by tag and digest.
#
# Usage:
#   cp .env.example .env   # then set REDIS_PASSWORD
#   Development:  docker compose up
#   Scale:        docker compose up --scale service=3 (drop the host port first)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Microservice
  # ---------------------------------------------------------------------------
  service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - RUST_LOG=${RUST_LOG:-info}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SERVICE_NAME=${SERVICE_NAME:-microservice}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (openssl rand -hex 32)}@redis:6379
      # Service discovery
      - CONSUL_URL=${CONSUL_URL:-http://consul:8500}
      # Distributed tracing
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_ENDPOINT:-http://jaeger:4317}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

  # ---------------------------------------------------------------------------
  # Redis (messaging/caching)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # The password is read from the environment inside the container rather
    # than interpolated into the command line by Compose.
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (openssl rand -hex 32)}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (openssl rand -hex 32)}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ---------------------------------------------------------------------------
  # Consul (Service Discovery) - Optional
  # ---------------------------------------------------------------------------
  consul:
    # Dev-mode agent: no ACLs, in-memory state. The listener is open inside
    # the container network, but published to the host on loopback only.
    image: hashicorp/consul:1.22.7@sha256:a230dcea0bb107bd7958a912d1429fb7f9d399637de7ffb814b34412b9e8c543
    command: agent -dev -client=0.0.0.0
    ports:
      - "127.0.0.1:8500:8500"
      - "127.0.0.1:8600:8600/udp"
    profiles:
      - discovery
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Jaeger (Distributed Tracing) - Optional
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.76.0@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "127.0.0.1:16686:16686"  # UI
      - "127.0.0.1:4317:4317"    # OTLP gRPC
      - "127.0.0.1:4318:4318"    # OTLP HTTP
    profiles:
      - tracing
    restart: unless-stopped

volumes:
  redis_data:

